services:
  postgres:
    image: postgres:15
    container_name: tryspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tryspace
      POSTGRES_PASSWORD: tryspace
      POSTGRES_DB: tryspace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
